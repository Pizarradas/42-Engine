        }

        .masthead-case__viewport {
            padding: 1rem;
            background: #fff;
        }

        .masthead-case__stack {
            display: grid;
            gap: 1rem;
        }

        .masthead-preview {
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 0.9rem;
            overflow: hidden;
            background: #fff;

        }

            left: auto;
            right: auto;
            visibility: visible;

            inset: auto;
            display: block;
            width: min(100%, 360px);
            max-width: 360px;
            height: auto;
            min-height: 28rem;
            transform: none;
            visibility: visible;
            opacity: 1;

        .sticky-text {

        }

        .sticky-link {

            overflow: hidden;
            text-indent: 101%;
            white-space: nowrap;
            opacity: 0;
        }

            border-radius: 0.3rem;

                    description: "Esta página repite el masthead de Viajar con sus variaciones editoriales. Cada casuística se descompone en tres previews independientes: <code>Normal</code>, <code>Fixed</code> y <code>Minimal header</code>.",

            const host = document.getElementById("mastheadRegionalesCases");
            const template = document.getElementById("mastheadRegionalesTemplate");
            const brandTitle = document.getElementById("brandTitle");
            const brandDescription = document.getElementById("brandDescription");
            const brandSelector = document.getElementById("brandSelector");
            const userStateSelector = document.getElementById("userStateSelector");
            const brandStylesRoot = document.getElementById("brandStyles-root");
            const brandStyles = document.getElementById("brandStyles");
            let currentUserState = userStateSelector ? userStateSelector.value : "login";

            function buildCase(brand, caseConfig, index) {
                const section = document.createElement("section");
                section.className = "masthead-case";

                const meta = document.createElement("div");
                meta.className = "masthead-case__meta";
                meta.innerHTML = `
                    <h2>${caseConfig.title}</h2>
                    <p>${caseConfig.description}</p>
                    <p><code>fourty ${brand.className} ${caseConfig.classes.join(" ")}</code></p>
                `;

                const viewport = document.createElement("div");
                viewport.className = "masthead-case__viewport";
                const stack = document.createElement("div");
                stack.className = "masthead-case__stack";

                const page = template.content.firstElementChild.cloneNode(true);
                page.className = `masthead-case__page fourty ${brand.className} ${caseConfig.classes.join(" ")}`;
                page.dataset.caseId = `case-${index + 1}`;

                namespaceCase(page, index + 1);
                applyUserStateToScope(page, currentUserState);
                stack.appendChild(createVariantPreview("Normal", page, {
                    brand,
                    pageClasses: caseConfig.classes,
                    sourceSelector: ".ft-org-masthead--branded",
                    note: "Vista base del masthead con la cabecera completa del medio."
                }));
                stack.appendChild(createVariantPreview("Fixed", page, {
                    brand,
                    pageClasses: caseConfig.classes,
                    sourceSelector: ".ft-org-masthead--fix",
                    variantClass: "masthead-preview--fixed",
                    note: "Vista aislada de la capa fija, mostrada de forma independiente."
                }));
                stack.appendChild(createVariantPreview("Minimal header", page, {
                    brand,
                    pageClasses: ["minimal-header", ...caseConfig.classes],
                    sourceSelector: ".ft-org-masthead--branded",
                    variantClass: "masthead-preview--minimal",
                    note: "Mismo masthead base bajo el ancestro `.minimal-header`."
                }));
                stack.appendChild(createVariantPreview("Side menu", page, {
                    brand,
                    pageClasses: caseConfig.classes,
                    sourceSelector: ".ft-org-masthead--side",
                    variantClass: "masthead-preview--side",
                    note: "Vista fija del lateral desplegado, recortada para revisar mejor su tramo superior.",
                    onClone: (clone) => {
                        clone.classList.add("active");
                    }
                }));

                viewport.appendChild(stack);
                section.appendChild(meta);
                section.appendChild(viewport);

                return section;
            }

            function namespaceCase(page, index) {
                page.querySelectorAll("[id]").forEach((node) => {
                    node.id = `${node.id}-${index}`;
                });

                page.querySelectorAll("[aria-controls]").forEach((node) => {
                    node.setAttribute("aria-controls", `${node.getAttribute("aria-controls")}-${index}`);
                });
            }

            function uniqueClasses(classes) {
                return [...new Set(classes.filter(Boolean))];
            }

            function humanizeCase(classes) {
                return classes
                    .map((token) => token.replace(/-/g, " "))
                    .join(" · ");
            }

            function parseCases(brand) {
                return Array.from(
                    new Map(
                        brand.rawCases
                            .split("\n")
                            .map((entry) => entry.replace(/\(.*?\)/g, " ").trim())
                            .filter(Boolean)
                            .map((entry) => entry.replace(brand.className, "").replace(/\s+/g, " ").trim())
                            .map((entry) => {
                                const classes = uniqueClasses(entry.split(" "));
                                const key = classes.join(" ");
                                return [
                                    key,
                                    {
                                        title: humanizeCase(classes.length ? classes : ["base"]),
                                        description: `Masthead ${brand.label}: \`${key || "base"}\`.`,
                                        classes
                                    }
                                ];
                            })
                    ).values()
                ).sort((a, b) => a.title.localeCompare(b.title, "es"));
            }

            function createVariantPreview(title, page, config) {
                const preview = document.createElement("article");
                preview.className = `masthead-preview ${config.variantClass || ""}`.trim();

                const previewMeta = document.createElement("div");
                previewMeta.className = "masthead-preview__meta";
                previewMeta.innerHTML = `<h3>${title}</h3>`;

                const previewPage = document.createElement("div");
                previewPage.className = `masthead-preview__page fourty ${config.brand.className} ${uniqueClasses(config.pageClasses).join(" ")}`;

                const sourceNode = page.querySelector(config.sourceSelector);
                if (sourceNode) {
                    const clone = sourceNode.cloneNode(true);
                    if (config.sourceSelector === ".ft-org-masthead--fix") {
                        clone.classList.add("visible");
                    }
                    if (typeof config.onClone === "function") {
                        config.onClone(clone);
                    }
                    previewPage.appendChild(clone);
                }

                const previewNote = document.createElement("div");
                previewNote.className = "masthead-preview__note";
                previewNote.innerHTML = `<p>${config.note}</p>`;

                preview.appendChild(previewMeta);
                preview.appendChild(previewPage);
                preview.appendChild(previewNote);

                return preview;
            }

            function applyUserStateToScope(scope, state) {
                const isLogged = state === "logged";

                scope.querySelectorAll("[data-user-state-button]").forEach((button) => {
                    button.classList.toggle("ft-org-masthead__area--logged", isLogged);

                    const label = button.querySelector("[data-user-state-label]");

                    if (!label) return;

                    label.hidden = !isLogged;
                    label.textContent = isLogged ? "BC" : "";
                });
            }

            function renderBrand(brandKey) {
                const brand = BRANDS[brandKey];
                const cases = parseCases(brand);

                brandStylesRoot.href = brand.stylesRoot;
                brandStyles.href = brand.stylesIndex;
                brandTitle.textContent = `Masthead ${brand.label} · casuística viva`;
                brandDescription.innerHTML = brand.description;
                host.setAttribute("aria-label", `Casuísticas ${brand.label}`);
                host.innerHTML = "";

                cases.forEach((caseConfig, index) => {
                    host.appendChild(buildCase(brand, caseConfig, index));
                });
            }

            brandSelector.addEventListener("change", (event) => {
                renderBrand(event.target.value);
            });

            userStateSelector.addEventListener("change", (event) => {
                currentUserState = event.target.value;
                applyUserStateToScope(host, currentUserState);
            });

            renderBrand(brandSelector.value);
        })();
    </script>

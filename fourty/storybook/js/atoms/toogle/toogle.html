      <span class="ft-toogle__button"><i class="ft-toogle__icon ft-toogle__iconLight"></i> Claro</span>
    </label>
    <label class="ft-toogle__option">
      <input type="radio" name="theme-demo">
      <span class="ft-toogle__button"><i class="ft-toogle__icon ft-toogle__iconDark"></i> Oscuro</span>
    </label>
    <label class="ft-toogle__option">
      <input type="radio" name="theme-demo">
      <span class="ft-toogle__button"><i class="ft-toogle__icon ft-toogle__iconSystem"></i> Por sistema</span>
    </label>
  </div>
</template>

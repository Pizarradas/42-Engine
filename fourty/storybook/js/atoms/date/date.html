<!-- ════════════════ BASE · .ft-date ════════════════ -->
<template data-story="Base">
  <div class="ft-date">
    <div class="ft-date__text">
      <span class="ft-date__textPlace">Barcelona</span>
      <time class="ft-date__textTime" itemprop="datePublished" datetime="2022-09-05T13:04:00+00:00">05 SEPT 2022 - 13:04 CET</time>
    </div>
    <time class="ft-date__reload" itemprop="dateModified" datetime="2023-02-07T12:35:00+00:00">Actualizada 07 FEB 2023 -12:35 CET</time>
  </div>
</template>

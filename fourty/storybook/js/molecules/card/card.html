<!--
  card.html — códigos HTML originales de Card (.ft-mol-card)
  ─────────────────────────────────────────────────────────────────────────
  FUENTE DE VERDAD del markup, editable por cualquier front SIN tocar JS.
  Markup tomado de fourty/molecules/molecule-card.html (variantes HTML5).
  Rutas de assets normalizadas ../../cds-statics → /cds-statics.
  ─────────────────────────────────────────────────────────────────────────
-->
<template data-story="Base">
  <div class="ft-mol-card">
    <a href="#" class="ft-mol-card__body" title="title text" target="_self">
      <div class="ft-mol-card__content">
        <figure class="ft-img">
          <picture>
            <source media="(min-width: 768px)" srcset="/cds-statics/assets/img/decorative/ft-mol-card-crucigrama.svg" />
            <img src="/cds-statics/assets/img/decorative/ft-mol-card-crucigrama.svg" width="656" height="381" loading="lazy" class="ft-mol-card__image" alt="alt text" title="title text" />
          </picture>
        </figure>
      </div>
      <div class="ft-mol-card__header">
        <div class="ft-mol-card__headband">
          <h3 class="ft-mol-card__title">Crucigrama</h3>
          <time class="ft-mol-card__date" datetime="2011-11-18">11/05/2025</time>
        </div>
        <p class="ft-mol-card__text">Pon a prueba tu ingenio y encuentra la palabra exacta para cada pista.</p>
        <div class="ft-mol-card__footer">
          <button type="button" class="ft-btn ft-btn--tertiary ft-btn--sm" title="title text">Juega Ya</button>
        </div>
      </div>
    </a>
  </div>
</template>

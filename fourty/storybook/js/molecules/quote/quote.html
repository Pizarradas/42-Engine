<template data-story="Base">
  <blockquote class="ft-mol-quote">

      <p class="ft-mol-quote__author--name">Lorem ipsum</p>
      <p class="ft-mol-quote__author--status"> — Director de Lorem ipsum</p>

  </blockquote>
</template>

<template data-story="Base">
  <figure class="ft-img">
    <picture>
      <source media="(min-width: 768px)" srcset="/cds-statics/assets/img/templates/ft-mol-box-photo-text-desktop--template.svg">
      <source media="(min-width: 250px)" srcset="/cds-statics/assets/img/templates/ft-mol-box-photo-text-mobile--template.svg">
      <img src="/cds-statics/assets/img/templates/ft-mol-box-photo-text-desktop--template.svg" width="656" height="381" loading="lazy" class="ft-helper-img-rd" alt="alt text" title="title text">
    </picture>
    <figcaption class="ft-mol-figcaption">
      <p class="ft-mol-figcaption__txt">
        <span class="ft-helper-fontWeight-800">Serge Aurier</span>,
        exjugador del Villarreal es el lateral libre más valioso de este mercado, con 10 millones. Juega en la banda derecha.
        <span class="ft-helper-fontWeight-800">/EFE/AFP</span>
      </p>
      <div class="ft-mol-number-highlighted">
        <span class="ft-mol-number-highlighted__item">3</span>
        <span class="ft-mol-number-highlighted__item">3</span>
      </div>
    </figcaption>
  </figure>
</template>

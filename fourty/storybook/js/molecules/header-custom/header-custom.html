<template data-story="Base">
  <div class="ft-mol-header-custom">
    <div class="ft-mol-header-custom__txt">
      <h1 class="ft-mol-header-custom__title">Notas de corte <span class="ft-mol-header-custom__highlighted">2024</span></h1>
      <p class="ft-mol-header-custom__subtitle">Lorem ipsum dolor est</p>
    </div>
    <figure class="ft-img">
      <picture>
        <source media="(min-width:640.1px)" srcset="/cds-statics/assets/img/templates/ft-mol-tab-header-custom-img-desktop--template.png" width="250" height="140">
        <source media="(max-width: 640px)" srcset="/cds-statics/assets/img/templates/ft-mol-tab-header-custom-img-mobile--template.png" width="710" height="540">
        <img src="/cds-statics/assets/img/templates/ft-mol-tab-header-custom-img-desktop--template.png" alt="" width="250" height="140" loading="eager" class="ft-helper-img-rd">
      </picture>
    </figure>
  </div>
</template>

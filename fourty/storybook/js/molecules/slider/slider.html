<template data-story="Base (3 slides)">
  <div class="ft-mol-carousel" role="region" aria-roledescription="carrusel" aria-labelledby="carouselHeadingMk">
    <h2 id="carouselHeadingMk" class="ft-mol-carousel__header">Imágenes destacadas</h2>
    <div class="ft-mol-carousel__wrapper">
      <div class="ft-mol-carousel__content">
        <label class="ft-mol-carousel__nav ft-mol-carousel__nav--prev" for="radio2"></label>
        <label class="ft-mol-carousel__nav ft-mol-carousel__nav--next" for="radio1"></label>
        <figure class="ft-mol-carousel__img"><img src="https://images.unsplash.com/photo-1675426513908-75bf6aaee78c?crop=entropy&cs=srgb&fm=jpg&ixlib=rb-4.0.3&q=85" alt="Image Description"></figure>
      </div>
    </div>
    <div class="ft-mol-carousel__wrapper">
      <div class="ft-mol-carousel__content">
        <label class="ft-mol-carousel__nav ft-mol-carousel__nav--prev" for="radio0"></label>
        <label class="ft-mol-carousel__nav ft-mol-carousel__nav--next" for="radio2"></label>
        <figure class="ft-mol-carousel__img"><img src="https://images.unsplash.com/photo-1684417211736-e114089d26ec?crop=entropy&cs=srgb&fm=jpg&ixlib=rb-4.0.3&q=85" alt="Image Description"></figure>
      </div>
    </div>
    <div class="ft-mol-carousel__wrapper">
      <div class="ft-mol-carousel__content">
        <label class="ft-mol-carousel__nav ft-mol-carousel__nav--prev" for="radio1"></label>
        <label class="ft-mol-carousel__nav ft-mol-carousel__nav--next" for="radio0"></label>
        <figure class="ft-mol-carousel__img"><img src="https://images.unsplash.com/photo-1685122956432-54551948f8fe?crop=entropy&cs=srgb&fm=jpg&ixlib=rb-4.0.3&q=85" alt="Image Description"></figure>
      </div>
    </div>
    <div class="ft-mol-carousel__pagination">
      <input type="radio" id="radio0" name="selectedImage" checked="checked">
      <input type="radio" id="radio1" name="selectedImage">
      <input type="radio" id="radio2" name="selectedImage">
    </div>
  </div>
</template>

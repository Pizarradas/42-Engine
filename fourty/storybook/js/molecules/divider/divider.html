<template data-story="Base">
  <div class="mol-divider">
    <div class="mol-divider__icon-wrapper ft-helper-bgColor-white">
      <img src="/cds-statics/assets/img/icons/mol-divider-icon--pin-off.svg" class="ft-img" alt="Icono de confluence">
    </div>
    <div class="mol-divider__block mol-divider__block--top ft-helper-fontSize-body-XL">
      <strong>Esto es todo por ahora</strong>
      <span>en tus localidades seleccionadas</span>
    </div>
    <div class="mol-divider__block mol-divider__block--bottom ft-helper-fontSize-body-XL">
      <strong>Descubre lo que ocurre cerca</strong>
      <span>de tus municipios favoritos</span>
    </div>
    <div class="mol-divider__tag">
      <div class="ft-tag ft-tag--md ft-tag--link ft-tag--badge">
        <img src="/cds-statics/assets/img/icons/tag-pin--grey.svg" class="ft-tag__img" alt="Icono de confluence">
        <span class="ft-tag__name">A un radio de</span>
        <span class="ft-tag__value">10 km</span>
        <a href="#" class="ft-link ft-link--block" title="title text">Link text</a>
      </div>
    </div>
  </div>
</template>

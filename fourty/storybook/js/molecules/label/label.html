<!--
  label.html — códigos HTML originales de Label (.ft-mol-label)
  ─────────────────────────────────────────────────────────────────────────
  FUENTE DE VERDAD del markup, editable por cualquier front SIN tocar JS.
  Markup tomado de fourty/molecules/molecule-label.html. Rutas /cds-statics.
  Las variantes "por medio" (un logo por cabecera) intercambian __image + texto
  sobre esta misma estructura; ver molecule-label.html para el catálogo completo.
  ─────────────────────────────────────────────────────────────────────────
-->
<template data-story="Base">
  <div class="ft-mol-label">
    <div class="ft-mol-label__content">
      <img src="/cds-statics/assets/img/icons/sport-icono-circle.svg" alt="Confidencial Sport" width="24" height="24" class="ft-mol-label__image">
      <p class="ft-mol-label__title">Confidencial Sport</p>
    </div>
  </div>
</template>

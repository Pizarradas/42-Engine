<template data-story="Base">
  <div class="ft-mol-sorting" role="region" aria-label="Ranking">
    <div class="ft-mol-sorting__header">
      <h2 class="ft-mol-sorting__title">Grupo B</h2>
      <a class="ft-link ft-link--tertiary ft-link--decoration" href="#">Editar</a>
    </div>
    <ul>
      <li class="ft-mol-sorting__list">
        <div class="ft-mol-sorting__info">
          <span class="ft-mol-sorting__infoNumber">#1</span>
          <img src="/cds-statics/assets/img/icons/icon-medalla-oro.svg" alt="medalla oro" width="20" height="20" class="ft-helper-img-rd">
          <h3 class="ft-mol-sorting__infoName">Nombre 1</h3>
        </div>
        <div class="ft-mol-sorting__status">
          <span class="ft-mol-sorting__statusBadge">Clasificado</span>
          <span class="ft-mol-sorting__statusPoints">55 pts esta jornada</span>
        </div>
      </li>
      <li class="ft-mol-sorting__list">
        <div class="ft-mol-sorting__info">
          <span class="ft-mol-sorting__infoNumber">#2</span>
          <img src="/cds-statics/assets/img/icons/icon-medalla-plata.svg" alt="medalla plata" width="20" height="20" class="ft-helper-img-rd">
          <h3 class="ft-mol-sorting__infoName">Nombre 2</h3>
        </div>
        <div class="ft-mol-sorting__status">
          <span class="ft-mol-sorting__statusBadge">Clasificado</span>
          <span class="ft-mol-sorting__statusPoints">55 pts esta jornada</span>
        </div>
      </li>
      <li class="ft-mol-sorting__list ft-mol-sorting__list--active">
        <div class="ft-mol-sorting__info">
          <span class="ft-mol-sorting__infoNumber">#3</span>
          <img src="/cds-statics/assets/img/icons/icon-medalla-bronce.svg" alt="medalla bronce" width="20" height="20" class="ft-helper-img-rd">
          <h3 class="ft-mol-sorting__infoName">Nombre 3</h3>
        </div>
        <div class="ft-mol-sorting__status">
          <span class="ft-mol-sorting__statusBadge">Clasificado</span>
          <span class="ft-mol-sorting__statusPoints">55 pts esta jornada</span>
        </div>
      </li>
      <li class="ft-mol-sorting__list ft-mol-sorting__list--primary">
        <div class="ft-mol-sorting__info">
          <span class="ft-mol-sorting__infoNumber">#4</span>
          <h3 class="ft-mol-sorting__infoName">Nombre 4</h3>
        </div>
        <div class="ft-mol-sorting__status">
          <span class="ft-mol-sorting__statusBadge ft-mol-sorting__statusBadge--green">Clasificado</span>
          <span class="ft-mol-sorting__statusPoints">55 pts esta jornada</span>
        </div>
      </li>
    </ul>
  </div>
</template>

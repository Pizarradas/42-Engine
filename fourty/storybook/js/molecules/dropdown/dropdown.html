<!--
  dropdown.html — códigos HTML originales de Dropdown (.ft-mol-dropdown)
  ─────────────────────────────────────────────────────────────────────────
  FUENTE DE VERDAD del markup, editable por cualquier front SIN tocar JS.
  Markup tomado de fourty/molecules/molecule-dropdown.html.

  Estado: en el showroom la lista va `hidden` y el JS añade `__listIs-active`
  al abrir. Aquí se muestran en estado ABIERTO (con __listIs-active, sin hidden,
  aria-expanded="true") para que se vean los ítems; es el estado que produce
  toggleDropdown. El wrapper reserva alto porque la lista es position:absolute.
  ─────────────────────────────────────────────────────────────────────────
-->
<template data-story="Base (abierto)">
  <div style="min-height:240px;">
    <div class="ft-mol-dropdown">
      <button type="button" class="ft-btn ft-btn--primary ft-btn--md ft-mol-dropdown__trigger" aria-haspopup="true" aria-expanded="true" title="Abrir menú desplegable">Dropdown</button>
      <ul class="ft-mol-dropdown__list ft-mol-dropdown__listIs-active" role="menu" aria-hidden="false">
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
      </ul>
    </div>
  </div>
</template>

<template data-story="Lista + botón nav (--is-list-rgt --has-btn-nav)">
  <div style="min-height:240px;">
    <div class="ft-mol-dropdown ft-mol-dropdown--is-list-rgt ft-mol-dropdown--has-btn-nav">
      <button type="button" class="ft-btn-nav ft-btn-nav--more-v ft-btn-nav--bordered ft-mol-dropdown__trigger" aria-haspopup="true" aria-expanded="true" title="Desplegar más opciones">
        <span class="ft-btn-nav__text">Desplegar más opciones</span>
        <span class="ft-btn-nav__icon" aria-hidden="true"></span>
      </button>
      <ul class="ft-mol-dropdown__list ft-mol-dropdown__listIs-active" role="menu" aria-hidden="false">
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
        <li class="ft-mol-dropdown__item" role="none"><a class="ft-mol-dropdown__link" role="menuitem" href="#" target="_self" title="title text">Lorem ipsum dolor est</a></li>
      </ul>
    </div>
  </div>
</template>

<template data-story="Con desplegables (summary)">
  <div style="min-height:240px;">
    <div class="ft-mol-dropdown ft-mol-dropdown--is-list-lft ft-mol-dropdown--has-btn-nav">
      <button type="button" class="ft-btn-nav ft-btn-nav--more-v ft-mol-dropdown__trigger" aria-haspopup="listbox" aria-expanded="true" id="more-nav-trigger2" aria-controls="more-nav-list2">
        <span class="ft-btn-nav__text">Desplegar más opciones</span>
        <span class="ft-btn-nav__icon" aria-hidden="true"></span>
      </button>
      <ul class="ft-mol-dropdown__list ft-mol-dropdown__listIs-active" id="more-nav-list2" aria-labelledby="more-nav-trigger2">
        <li class="ft-mol-dropdown__item">
          <details class="ft-mol-dropdown__details" open>
            <summary class="ft-mol-dropdown__summary">

              <li class="ft-mol-dropdown__details-item">Item desplegado</li>

    </div>

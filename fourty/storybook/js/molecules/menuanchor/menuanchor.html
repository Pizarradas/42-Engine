<!--
  menuanchor.html — código HTML original de Menu Anchor (.ft-mol-menu-anchor)
  ─────────────────────────────────────────────────────────────────────────
  FUENTE DE VERDAD del markup, editable por cualquier front SIN tocar JS.
  Markup tomado de fourty/molecules/molecule-menu-anchor.html.
  ⚠ Clase kebab .ft-mol-menu-anchor (carpeta "menuanchor").
  ─────────────────────────────────────────────────────────────────────────
-->
<template data-story="Base">
  <div class="ft-mol-menu-anchor" role="banner">
    <nav aria-label="Navegación de secciones">
      <div class="ft-anchor" role="list">
        <a href="#id-item-0" role="listitem">Sección 0</a>
        <a href="#id-item-1" role="listitem">Sección 1</a>
        <a href="#id-item-2" role="listitem">Sección 2</a>
      </div>
    </nav>
  </div>
</template>

<template data-story="Centrado (--is-centered)">
  <div class="ft-mol-menu-anchor ft-mol-menu-anchor--is-centered" role="banner">
    <nav aria-label="Navegación de secciones">
      <div class="ft-anchor" role="list">
        <a href="#id-item-0" role="listitem">Sección 0</a>
        <a href="#id-item-1" role="listitem">Sección 1</a>
        <a href="#id-item-2" role="listitem">Sección 2</a>
      </div>
    </nav>
  </div>
</template>

<!-- --is-sticky: la barra se fija arriba al hacer scroll (position:sticky) -->
<template data-story="Fija (--is-sticky)">
  <div class="ft-mol-menu-anchor ft-mol-menu-anchor--is-sticky" role="banner">
    <nav aria-label="Navegación de secciones">
      <div class="ft-anchor" role="list">
        <a href="#id-item-0" role="listitem">Sección 0</a>
        <a href="#id-item-1" role="listitem">Sección 1</a>
        <a href="#id-item-2" role="listitem">Sección 2</a>
      </div>
    </nav>
  </div>
</template>

<template data-story="Base">
  <div class="ft-mol-boxInfo">
    <div class="ft-img">
      <img src="/cds-statics/assets/img/templates/ft-mol-boxinfo70x95.svg" width="70" height="95" loading="lazy" class="ft-helper-img-rd" alt="alt text" title="title text">
    </div>
    <div class="ft-mol-boxInfo__content">
      <p class="ft-text">Certificado autorresponsable de movilidad COVID de la ciudad de Vigo en PDF lorem ipsum dolorem est</p>
      <a href="#" class="ft-btn ft-btn--secondary ft-btn--sm" title="title text" target="_self">Ver PDF</a>
    </div>
  </div>
</template>

    </div>

      <p class="ft-text"><strong>¿Cuándo?</strong> Miércoles y Jueves (20.30h), Viernes, Sábado y Domingo (21:30)</p>

  </div>
</template>

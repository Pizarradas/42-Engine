<!-- Markup canónico de .ft-helper-property* — subgrupo "Markup" del storybook -->

<template data-story="Opacity 50%">
    <div class="ft-helper-bgColor-primary ft-helper-property-opacity-50 ft-helper-spacer-inner-sm">
        <p class="ft-helper-fontColor-white">Bloque al 50% sobre el fondo del consumidor.</p>
    </div>
</template>

<template data-story="Round md">
    <button type="button"
            class="ft-helper-bgColor-primary ft-helper-property-round-md ft-helper-fontColor-white"
            style="border:0;padding:10px 18px;cursor:pointer;">
        Botón con esquinas redondeadas
    </button>
</template>

<template data-story="Border thin lightgrey">
    <section class="ft-helper-property-border ft-helper-property-border-thin ft-helper-property-border-lightgrey ft-helper-spacer-inner-md">
        <p>Sección delimitada por una línea fina gris claro.</p>
    </section>
</template>

<template data-story="Indicador live">
    <p class="ft-helper-property--live ft-helper-fontType--uppercase ft-helper-fontWeight-700 ft-helper-fontSize-body-S ft-helper-fontColor-darkGrey">
        En directo
    </p>
</template>

<template data-story="Texto en 2 columnas">
    <article class="ft-helper-property-column-count-xs ft-helper-property-column-gap-md">
        <p>Primer párrafo del artículo. Cuando el viewport llega a 1024px, el texto se distribuye en 2 columnas.</p>
        <p>Segundo párrafo que sigue el flujo de la maquetación multi-column.</p>
        <p>Tercer párrafo. El column-gap regula la calle entre columnas.</p>
        <p>Cuarto párrafo para que haya suficiente contenido para repartir.</p>
    </article>
</template>

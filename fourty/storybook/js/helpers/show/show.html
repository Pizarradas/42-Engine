<!-- Markup canónico de .ft-helper-show* — subgrupo "Markup" del storybook -->

<template data-story="Show solo en móvil + show solo en desktop">
    <header style="background:#f5f5f5;padding:14px;">
        <button class="ft-helper-show-mo" type="button"
                style="padding:8px 12px;background:#0050b3;color:#fff;border:0;border-radius:3px;">
            ☰ Menú
        </button>
        <nav class="ft-helper-show-sm" style="gap:12px;">
            <a href="#" style="color:#0050b3;text-decoration:none;">Inicio</a>
            <a href="#" style="color:#0050b3;text-decoration:none;">Sección</a>
            <a href="#" style="color:#0050b3;text-decoration:none;">Contacto</a>
        </nav>
    </header>
</template>

<template data-story="Display utility · flex middle + center">
    <div class="ft-helper-show-flex ft-helper-show-flex-middle ft-helper-show-flex-center"
         style="gap:8px;background:#f5f5f5;height:140px;border:1px dashed #999;">
        <span style="background:#0050b3;color:#fff;padding:8px 12px;border-radius:3px;">contenido centrado en 2 ejes</span>
    </div>
</template>

<template data-story="Layout con space-between">
    <div class="ft-helper-show-flex ft-helper-show-flex-middle ft-helper-show-flex-spacebetween"
         style="gap:10px;background:#f5f5f5;padding:12px 16px;">
        <strong>Título de la sección</strong>
        <button type="button" class="ft-btn ft-btn--secondary">Acción</button>
    </div>
</template>

<template data-story="inline-block con vertical-align middle">
    <p>
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><circle cx='16' cy='16' r='14' fill='%230050b3'/></svg>"
             class="ft-helper-show-inline-block ft-helper-show-inline-middle" alt="">
        Texto a la derecha del avatar alineado en el medio.
    </p>
</template>

<template data-story="show-md (visible solo desde ≥1002px)">
    <div style="background:#f5f5f5;padding:14px;">
        <p>Texto siempre visible.</p>
        <aside class="ft-helper-show-md" style="background:#fffbe6;padding:10px;border-radius:3px;">
            Sidebar contextual que solo aparece desde 1002px.
        </aside>
    </div>
</template>

<!-- Markup canónico de .ft-helper-text-* — subgrupo "Markup" del storybook -->

<template data-story="Texto centrado">
    <p class="ft-helper-text-align-center ft-helper-fontSize-body-L">
        Párrafo centrado horizontalmente.
    </p>
</template>

<template data-story="Etiqueta en mayúsculas">
    <p class="ft-helper-text-transform-uppercase ft-helper-fontSize-body-S ft-helper-fontWeight-700 ft-helper-fontColor-primary">
        Es noticia
    </p>
</template>

<template data-story="Capitalize en nombres">
    <p class="ft-helper-text-transform-capitalize ft-helper-fontSize-body-M">
        josé luis pérez · maría garcía
    </p>
</template>

<template data-story="Hide solo en móvil">
    <p class="ft-helper-text-hide-xs">
        Este texto se oculta en pantallas ≤768px (manteniendo el bloque por accesibilidad/SEO).
    </p>
</template>
